name: Daily Tender Monitor

on:
  schedule:
    # 08:00 AM India Standard Time (IST, UTC+5:30) is 02:30 AM UTC
    # Cron format: minute hour day month day-of-week (in UTC)
    - cron: '30 2 * * *'

  # Allows manual execution from GitHub -> Actions -> Daily Tender Monitor -> Run workflow
  workflow_dispatch:
    inputs:
      test_two_runs:
        description: 'Run two 5-minute test cycles (Run 1 -> wait 5m -> Run 2 -> Stop)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (Scrape and generate email without actually sending)'
        required: false
        default: false
        type: boolean
      include_existing:
        description: 'Include active unnotified tenders even if previously seen'
        required: false
        default: false
        type: boolean

jobs:
  tender-monitor:
    name: Run Daily Tender Scraper & Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Restores previous SQLite database to maintain deduplication and sent-tender history
      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: backend/tenders.db
          key: tenders-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tenders-db-${{ runner.os }}-

      - name: Run Daily Tender Job
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.include_existing }}" = "true" ]; then
            ARGS="$ARGS --include-existing"
          fi
          if [ "${{ github.event.inputs.test_two_runs }}" = "true" ]; then
            ARGS="$ARGS --test-two-runs --delay-seconds 300"
          fi
          python daily_job.py $ARGS
